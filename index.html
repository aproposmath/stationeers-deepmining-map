<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Stationeers Maps</title>
  <link rel="icon" type="image/webp" href="icon_transparent.webp">
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-hsv.v0.1.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
</head>

<body>
  <div id="root">
    <!-- Left side panel - Celestial Bodies & Map Layers -->
    <div id="fileButtons">
      <div class="section-header">Explore</div>
      <p class="panel-description">Select a celestial body and map layer to get started.</p>
      <div id="buttonsHeader">
        <div class="button-group">
          <div class="button-group-label">Celestial Bodies</div>
          <div id="planetButtons">
            <button data-file="lunar">Lunar</button>
            <button data-file="europa">Europa</button>
            <button data-file="mars">Mars</button>
            <button data-file="mimas">Mimas</button>
            <button data-file="venus">Venus</button>
            <button data-file="vulcan">Vulcan</button>
          </div>
        </div>

        <div class="button-group button-group-secondary">
          <div class="button-group-label">Map Layers</div>
          <div id="regionTypeButtons">
            <button data-region="mining">Mining</button>
            <button data-region="names">Names</button>
            <button data-region="poi">POI</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Canvas container with map -->
    <div id="canvasContainer">
      <svg id="svg"></svg>
      <div id="iconLayer"></div>
    </div>

    <!-- Right side panel - Display Options & Filters -->
    <div id="sidePane">
      <div class="sidePane-content">
        <div>
          <div class="section-header">Display</div>
          <p class="panel-description">Customize what you see on the map.</p>
          <label>
            <input type="checkbox" id="toggleTerrain" checked> Terrain
          </label>
          <label>
            <input type="checkbox" id="toggleSpawn"> Start Locations
          </label>
          <label>
            <input type="checkbox" id="toggleNorth"> North Up
          </label>
          <label>
            <button id="newcoord"> New Custom Location </button>
          </label><label>
            <button id="import"> Import Custom Locations </button>
          </label>
          <label>
            <button id="export"> Export Custom Locations </button>
          </label>
        </div>

        <div class="filter-section">
          <div class="section-header">Filters</div>
          <p class="panel-description">Show or hide regions by color.</p>
          <div id="colorFilter"></div>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="share" class="fab fab--share" title="Share view">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512">
          <path fill="currentColor"
            d="M384 192c53 0 96-43 96-96s-43-96-96-96-96 43-96 96c0 5.4 .5 10.8 1.3 16L159.6 184.1c-16.9-15-39.2-24.1-63.6-24.1-53 0-96 43-96 96s43 96 96 96c24.4 0 46.6-9.1 63.6-24.1L289.3 400c-.9 5.2-1.3 10.5-1.3 16 0 53 43 96 96 96s96-43 96-96-43-96-96-96c-24.4 0-46.6 9.1-63.6 24.1L190.7 272c.9-5.2 1.3-10.5 1.3-16s-.5-10.8-1.3-16l129.7-72.1c16.9 15 39.2 24.1 63.6 24.1z" />
        </svg>
      </button>

      <a
        href="https://github.com/aproposmath/stationeers-deepmining-map"
        target="_blank"
        rel="noopener noreferrer"
        class="fab fab--github"
        title="View on GitHub"
        id="github"
      >
         <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M12 .5C5.73.5.5 5.73.5 12c0 5.1 3.29 9.43 7.86 10.96.57.1.78-.25.78-.55v-2.1c-3.2.7-3.87-1.54-3.87-1.54-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.73-1.54-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.43-2.71 5.4-5.29 5.68.41.36.78 1.07.78 2.16v3.2c0 .3.21.66.79.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z" />
          </svg>
        </a>
      </div>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div id="toast" class="toast">Link copied to clipboard!</div>
  <script src="script.js"></script>
</body>

</html>
